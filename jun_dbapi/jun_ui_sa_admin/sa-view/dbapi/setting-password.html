<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="c-panel">
            <div class="c-title">修改密码</div>
            <div style="max-width: 500px; margin: 0 auto; padding-top: 30px;">
                <el-form :model="form" :rules="rules" ref="form" label-width="100px">
                    <el-form-item label="旧密码" prop="oldPassword">
                        <el-input type="password" v-model="form.oldPassword" placeholder="请输入旧密码" show-password></el-input>
                    </el-form-item>
                    <el-form-item label="新密码" prop="newPassword">
                        <el-input type="password" v-model="form.newPassword" placeholder="请输入新密码" show-password></el-input>
                    </el-form-item>
                    <el-form-item label="确认密码" prop="confirmPassword">
                        <el-input type="password" v-model="form.confirmPassword" placeholder="请再次输入新密码" show-password></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="submit">确认修改</el-button>
                        <el-button @click="reset">重置</el-button>
                    </el-form-item>
                </el-form>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@2.6.10/dist/vue.min.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/dbapi.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                form: {
                    oldPassword: '',
                    newPassword: '',
                    confirmPassword: ''
                },
                rules: {
                    oldPassword: [{ required: true, message: '请输入旧密码', trigger: 'blur' }],
                    newPassword: [
                        { required: true, message: '请输入新密码', trigger: 'blur' },
                        { min: 3, message: '密码长度不少于3位', trigger: 'blur' }
                    ],
                    confirmPassword: [
                        { required: true, message: '请再次输入新密码', trigger: 'blur' },
                        {
                            validator: function(rule, value, callback) {
                                if (value !== app.form.newPassword) {
                                    callback(new Error('两次输入的密码不一致'));
                                } else {
                                    callback();
                                }
                            },
                            trigger: 'blur'
                        }
                    ]
                }
            },
            methods: {
                submit: function() {
                    var me = this;
                    this.$refs.form.validate(function(valid) {
                        if (!valid) return;
                        dbapi.ajax('/user/resetPassword', {
                            oldPassword: me.form.oldPassword,
                            newPassword: me.form.newPassword
                        }, function(res) {
                            me.$message.success('密码修改成功');
                            me.reset();
                        });
                    });
                },
                reset: function() {
                    this.form = { oldPassword: '', newPassword: '', confirmPassword: '' };
                }
            }
        });
    </script>
</body>
</html>
