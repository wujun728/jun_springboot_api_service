<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="c-panel">
            <div class="c-title">API 分组管理</div>
            <div style="padding-top: 10px;">
                <el-button type="primary" size="small" icon="el-icon-plus" @click="showAdd">新增分组</el-button>
            </div>
            <div style="padding-top: 15px;">
                <el-tag v-for="item in groupList" :key="item.id" closable size="medium"
                    style="margin: 5px 10px 5px 0;"
                    @close="deleteGroup(item)">
                    {{ item.name }}
                </el-tag>
                <div v-if="groupList.length === 0" style="color: #999; padding: 20px 0;">暂无分组</div>
            </div>
        </div>

        <!-- 新增分组对话框 -->
        <el-dialog title="新增分组" :visible.sync="dialogVisible" width="400px">
            <el-form label-width="80px">
                <el-form-item label="分组名称">
                    <el-input v-model="newGroupName" placeholder="请输入分组名称"></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer">
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="primary" @click="addGroup">确定</el-button>
            </div>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@2.6.10/dist/vue.min.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/dbapi.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                groupList: [],
                dialogVisible: false,
                newGroupName: ''
            },
            mounted: function() {
                this.loadGroups();
            },
            methods: {
                loadGroups: function() {
                    var me = this;
                    dbapi.ajax('/group/getAll/', function(res) {
                        me.groupList = res.data || res || [];
                    });
                },
                showAdd: function() {
                    this.newGroupName = '';
                    this.dialogVisible = true;
                },
                addGroup: function() {
                    var me = this;
                    if (!this.newGroupName.trim()) {
                        return this.$message.warning('请输入分组名称');
                    }
                    dbapi.ajax('/group/create/', { name: this.newGroupName }, function(res) {
                        me.$message.success('创建成功');
                        me.dialogVisible = false;
                        me.loadGroups();
                    });
                },
                deleteGroup: function(item) {
                    var me = this;
                    this.$confirm('确定删除分组【' + item.name + '】？', '提示', { type: 'warning' }).then(function() {
                        dbapi.ajax('/group/delete/' + item.id, function(res) {
                            me.$message.success('删除成功');
                            me.loadGroups();
                        });
                    }).catch(function() {});
                }
            }
        });
    </script>
</body>
</html>
