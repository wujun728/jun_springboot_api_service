<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="c-panel">
            <div class="c-title">数据源列表</div>
            <div style="padding: 10px 0;">
                <el-button type="primary" size="small" icon="el-icon-plus" @click="goAdd">新增数据源</el-button>
                <el-button type="success" size="small" icon="el-icon-download" @click="exportAll">导出</el-button>
                <el-button type="warning" size="small" icon="el-icon-upload2" @click="showImport">导入</el-button>
            </div>
            <el-table :data="dataList" border stripe>
                <el-table-column type="index" label="#" width="50"></el-table-column>
                <el-table-column label="名称" prop="name" min-width="150"></el-table-column>
                <el-table-column label="类型" prop="type" width="120">
                    <template slot-scope="s">
                        <el-tag size="small">{{ s.row.type }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="JDBC URL" prop="url" min-width="300" show-overflow-tooltip></el-table-column>
                <el-table-column label="更新时间" width="170">
                    <template slot-scope="s">{{ formatDate(s.row.updateTime) }}</template>
                </el-table-column>
                <el-table-column label="操作" width="250" fixed="right">
                    <template slot-scope="s">
                        <el-button size="mini" type="primary" @click="goEdit(s.row)">编辑</el-button>
                        <el-button size="mini" type="info" @click="goDetail(s.row)">详情</el-button>
                        <el-button size="mini" type="danger" @click="deleteItem(s.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
        </div>

        <!-- 导入对话框 -->
        <el-dialog title="导入数据源" :visible.sync="importVisible" width="450px">
            <el-upload ref="upload" action="" :auto-upload="false" :on-change="onFileChange" :limit="1" accept=".json">
                <el-button size="small" type="primary">选择文件</el-button>
                <div slot="tip" class="el-upload__tip">选择 JSON 格式的数据源配置文件</div>
            </el-upload>
            <div slot="footer">
                <el-button @click="importVisible = false">取消</el-button>
                <el-button type="primary" @click="doImport">确定导入</el-button>
            </div>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@2.6.10/dist/vue.min.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/dbapi.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                dataList: [],
                importVisible: false,
                importFile: null
            },
            mounted: function() {
                this.loadData();
            },
            methods: {
                formatDate: function(ts) { return dbapi.formatDate(ts); },
                loadData: function() {
                    var me = this;
                    dbapi.ajax('/datasource/getAll', function(res) {
                        me.dataList = res.data || res || [];
                    });
                },
                goAdd: function() {
                    if (window.parent && parent.sa_admin) {
                        parent.sa_admin.showTab({id: 'ds-add', name: '新增数据源', url: 'sa-view/dbapi/datasource-add.html'});
                    }
                },
                goEdit: function(row) {
                    if (window.parent && parent.sa_admin) {
                        parent.sa_admin.showTab({id: 'ds-edit-' + row.id, name: '编辑数据源', url: 'sa-view/dbapi/datasource-add.html?id=' + row.id});
                    }
                },
                goDetail: function(row) {
                    if (window.parent && parent.sa_admin) {
                        parent.sa_admin.showTab({id: 'ds-detail-' + row.id, name: '数据源详情', url: 'sa-view/dbapi/datasource-add.html?id=' + row.id + '&readonly=1'});
                    }
                },
                deleteItem: function(row) {
                    var me = this;
                    this.$confirm('确定删除数据源【' + row.name + '】？', '提示', { type: 'warning' }).then(function() {
                        dbapi.ajax('/datasource/delete/' + row.id, function(res) {
                            me.$message.success('删除成功');
                            me.loadData();
                        });
                    }).catch(function() {});
                },
                exportAll: function() {
                    var ids = this.dataList.map(function(item) { return item.id; }).join(',');
                    if (!ids) return this.$message.warning('暂无数据');
                    dbapi.ajax('/datasource/export?ids=' + ids, {}, function(blob, xhr) {
                        dbapi.downloadBlob(blob, 'datasource-export.json');
                    }, { responseType: 'blob' });
                },
                showImport: function() {
                    this.importFile = null;
                    this.importVisible = true;
                },
                onFileChange: function(file) {
                    this.importFile = file.raw;
                },
                doImport: function() {
                    if (!this.importFile) return this.$message.warning('请选择文件');
                    var me = this;
                    var formData = new FormData();
                    formData.append('file', this.importFile);
                    dbapi.upload('/datasource/import', formData, function(res) {
                        me.$message.success('导入成功');
                        me.importVisible = false;
                        me.loadData();
                    });
                }
            }
        });
    </script>
</body>
</html>
