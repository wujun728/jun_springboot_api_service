spring.application.name=dbApi

spring.cache.type=ehcache
spring.cache.ehcache.config=classpath:ehcache.xml

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

logging.file=./logs/dbApi.log
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss,CTT} [%-5level] [%class:%line] - %msg%n 
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss,CTT} [%-5level] [%class:%line] - %msg%n

# show mybatis sql
#logging.level.com.gitee.freakchicken.dbapi.dao=debug

logging.level.com.gitee.freakchicken.dbapi.service.ApiConfigService=debug
logging.level.com.gitee.freakchicken.dbapi.plugin.RedisCachePlugin=debug
#show api Sql
logging.level.com.gitee.freakchicken.dbapi.util.JdbcUtil=debug

#################################### JWT 配置 ########################################
# JWT 签名密钥（生产环境请替换为强随机密钥，至少32字符）
dbapi.jwt.secret=ChangeMe_DBApi_JWT_Secret_2026!@#$%^&*()_REPLACE_IN_PRODUCTION

#################################### AES 加密配置 ########################################
# AES-256 加密密钥（Base64 编码的 32 字节密钥，生产环境请替换）
# 生成方式: openssl rand -base64 32
dbapi.encrypt.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

#################################### 修改以下配置 ########################################

server.port=8520

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

#spring.datasource.driver-class-name=org.sqlite.JDBC
#spring.datasource.url=jdbc:sqlite::resource:sqlite.db
#spring.datasource.username=
#spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/db_api?useSSL=false&characterEncoding=UTF-8&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=mysqladmin



