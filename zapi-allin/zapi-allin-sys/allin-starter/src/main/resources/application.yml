# 文件服务配置
zapi:
  file:
    # 存储类型（LOCAL-本地，OSS-阿里云OSS，FTP-FTP服务器）
    storage-type: LOCAL
    # 本地存储配置
    local:
      # 本地存储根路径
      root-path: /Users/zhonglz/work/fileData/zapi-all/
      # 文件访问URL前缀
      url-prefix: /file/download/
    # 文件上传配置
    upload:
      # 最大文件大小（MB）
      max-file-size: 100
      # 允许的文件类型
      allowed-types:
        - jpg
        - jpeg
        - png
        - gif
        - bmp
        - webp
        - doc
        - docx
        - xls
        - xlsx
        - ppt
        - pptx
        - pdf
        - txt
        - zip
        - rar
        - 7z
        - tar
        - gz
      # 禁止的文件类型
      forbidden-types:
        - exe
        - bat
        - cmd
        - com
        - scr
        - pif
        - vbs
        - js

    # 文件转换配置
    conversion:
      # 是否启用文件转换功能
      enabled: true
      # 转换临时目录
      temp-dir: ${java.io.tmpdir}/file-conversion
      # 转换文件最大大小（MB）
      max-file-size: 50
      # 转换超时时间（秒）
      timeout: 300
      # 是否启用异步转换
      async-conversion: false
      # 转换任务保留时间（小时）
      task-retention-hours: 24
      # 支持的输入格式
      supported-input-formats:
        - doc
        - docx
        - pdf
        - ofd
      # 支持的输出格式
      supported-output-formats:
        - pdf
        - docx
        - ofd

  notification:
    # 站内信配置
    station-message:
      # 是否启用站内信
      enabled: true
      # 消息保留天数
      retention-days: 90
      # 最大消息长度
      max-content-length: 1000
    # 实时消息配置
    real-time-message:
      # 是否启用实时消息
      enabled: true
      # WebSocket端点
      endpoint: /ws/notification
      # 心跳间隔（秒）
      heartbeat-interval: 30
      # 连接超时时间（秒）
      connection-timeout: 60
# JWT配置
jwt:
  enabled: false
