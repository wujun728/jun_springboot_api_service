server:
  port: 8080
  servlet:
    context-path: /zapi-allin-sys

spring:
  application:
    name: zapi-allin-sys
  # Redis配置
  redis:
    # Redis服务器地址
    host: 127.0.0.1
    # Redis服务器端口
    port: 6379
    # Redis服务器密码（如果有）
    password: 123456
    # 连接超时时间（毫秒）
    timeout: 3000ms
    # 数据库索引（0-15）
    database: 0

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zapi_allin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Zlz1121...

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    com.zapi: debug
    org.springframework.security: debug

# Swagger配置
springfox:
  documentation:
    swagger-ui:
      enabled: true

# OnlyOffice Configuration
onlyoffice:
  # 注意：这里使用的是文档服务的根地址，不是welcome页面
  #document-server-url: http://8.138.158.220:7086/
  document-server-url: http://192.168.3.238:7086/
  # 你的JWT密钥，请替换为上面获取到的真实密钥
  # jwt-secret: Mm22arwSUSAvUneEhNR4OWKWlKdSeR6W
  jwt-secret: HVym5Rdn4I5EbiZqnfYzFh5KsHqnan34
  # 前端页面的地址，用于构建回调URL
  frontend-url: http://localhost:5173
  # 对 Docs Server 可达的后端基地址
