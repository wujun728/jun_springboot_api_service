<!-- htmlcs-disable -->
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <title>Editor</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    <link rel="stylesheet" href="/node_modules/@fortawesome/fontawesome-free/css/all.css"/>
    <link rel="stylesheet" href="/node_modules/@fortawesome/fontawesome-free/css/v4-shims.css"/>
    <link rel="stylesheet" type="text/css" href="/node_modules/amis-theme-editor/lib/renderers.css"/>
    <link rel="stylesheet" href="/node_modules/amis/lib/themes/default.css"/>
    <link rel="stylesheet" href="/node_modules/amis-editor-core/lib/style.css"/>
</head>

<body>
<div id="root" class="app-wrapper"></div>
<script src="/mod.js"></script>
<script type="text/javascript" src="/pkg/editor.html_map.js"></script>
<script type="text/javascript">
    /* @require ./index.jsx 标记为同步依赖，提前加载 */

    // 备注: 需要带上自定义组件，避免移动端渲染异常
    /* globals amis */
    amis.require(['node_modules/amis-editor/lib/index', 'node_modules/react-dom/index', 'renderer/MyRenderer.tsx'], function (editor, reactDom) {
        editor.mountInIframe(document.getElementById('root'), reactDom);
    });
</script>
</body>
</html>
